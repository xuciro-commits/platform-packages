name: release

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "catalog.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pkg from the pinned platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(tr -d '[:space:]' < platform.lock)
          cd "$RUNNER_TEMP"
          gh release download "$release" --repo xuciro-commits/platform --pattern pkg-linux-amd64 --pattern SHA256SUMS
          grep '  pkg-linux-amd64$' SHA256SUMS | sha256sum -c -
          install -m 0755 pkg-linux-amd64 "$RUNNER_TEMP/pkg"

      - name: Download the latest release of every package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/packages.mjs download

      - name: Build every version that has no tag yet
        run: |
          set -euo pipefail
          node scripts/packages.mjs catalog --check --pkg="$RUNNER_TEMP/pkg"
          node scripts/packages.mjs release --out=dist --pkg="$RUNNER_TEMP/pkg" | tee pending.txt
          if [ -s pending.txt ]; then echo "PENDING=1" >> "$GITHUB_ENV"; fi

      - name: Attest build provenance
        if: env.PENDING == '1'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*/*.json

      - name: Tag and publish
        if: env.PENDING == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r tag name; do
            artifact=$(find "dist/$name" -maxdepth 1 -name '*.json')
            gh release create "$tag" "$artifact" "dist/$name/SHA256SUMS" \
              --target "$GITHUB_SHA" --title "$tag" --notes-file "dist/$name/NOTES.md" --latest=false
          done < pending.txt
