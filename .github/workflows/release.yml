name: release

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "catalog.json"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Packages are released only with a released platform pkg
        id: lock
        run: |
          pin=$(tr -d '[:space:]' < platform.lock)
          if [[ $pin =~ ^v[0-9] ]]; then echo "release=1" >> "$GITHUB_OUTPUT"
          else echo "::notice::platform.lock pins platform commit $pin; nothing is released until it pins a platform release"; fi

      - name: Download pkg from the pinned platform release
        if: steps.lock.outputs.release == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-pkg.sh "$RUNNER_TEMP/pkg"

      - name: Download the latest release of every package
        if: steps.lock.outputs.release == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/packages.mjs download

      - name: Build every version that has no tag yet
        if: steps.lock.outputs.release == '1'
        run: |
          set -euo pipefail
          node scripts/packages.mjs catalog --check --pkg="$RUNNER_TEMP/pkg"
          node scripts/packages.mjs release --out=dist --pkg="$RUNNER_TEMP/pkg" | tee pending.txt
          if [ -s pending.txt ]; then echo "PENDING=1" >> "$GITHUB_ENV"; fi

      - name: Attest build provenance
        if: steps.lock.outputs.release == '1' && env.PENDING == '1'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*/*.json

      - name: Tag and publish
        if: steps.lock.outputs.release == '1' && env.PENDING == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r tag name; do
            artifact=$(find "dist/$name" -maxdepth 1 -name '*.json')
            gh release create "$tag" "$artifact" "dist/$name/SHA256SUMS" \
              --target "$GITHUB_SHA" --title "$tag" --notes-file "dist/$name/NOTES.md" --latest=false
          done < pending.txt
