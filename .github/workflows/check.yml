name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read platform.lock
        id: lock
        run: |
          pin=$(tr -d '[:space:]' < platform.lock)
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          if [[ $pin =~ ^[0-9a-f]{40}$ ]]; then echo "commit=1" >> "$GITHUB_OUTPUT"; fi

      - name: Check out the pinned platform commit
        if: steps.lock.outputs.commit == '1'
        uses: actions/checkout@v4
        with:
          repository: xuciro-commits/platform
          ref: ${{ steps.lock.outputs.pin }}
          path: .platform

      - name: Set up Go for the pinned platform commit
        if: steps.lock.outputs.commit == '1'
        uses: actions/setup-go@v5
        with:
          go-version-file: .platform/capabilities/server/go.mod
          cache-dependency-path: .platform/capabilities/server/go.sum

      - name: Get pkg from the pinned platform release or commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/install-pkg.sh "$RUNNER_TEMP/pkg"

      - name: Layout, CHANGELOG and version order
        run: node scripts/packages.mjs layout

      - name: Download the latest release of every package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/packages.mjs download

      - name: Validate, check the lock and compare with the released version
        run: |
          if compgen -G "packages/*/package.yaml" > /dev/null; then "$RUNNER_TEMP/pkg" check -packages packages; fi
          "$RUNNER_TEMP/pkg" check templates/app

      - name: Review the upgrade from the released version and the version bump
        run: if compgen -G "packages/*/package.yaml" > /dev/null; then "$RUNNER_TEMP/pkg" diff -packages packages; fi

      - name: catalog.json matches the sources
        run: node scripts/packages.mjs catalog --check --pkg="$RUNNER_TEMP/pkg"

      - name: Builds are reproducible
        run: node scripts/packages.mjs reproducible --pkg="$RUNNER_TEMP/pkg"
