name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download pkg from the pinned platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release=$(tr -d '[:space:]' < platform.lock)
          cd "$RUNNER_TEMP"
          gh release download "$release" --repo xuciro-commits/platform --pattern pkg-linux-amd64 --pattern SHA256SUMS
          grep '  pkg-linux-amd64$' SHA256SUMS | sha256sum -c -
          install -m 0755 pkg-linux-amd64 "$RUNNER_TEMP/pkg"

      - name: Layout, CHANGELOG and version order
        run: node scripts/packages.mjs layout

      - name: Download the latest release of every package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/packages.mjs download

      - name: Validate, check the lock and compare with the released version
        run: |
          if compgen -G "packages/*/package.yaml" > /dev/null; then "$RUNNER_TEMP/pkg" check -packages packages; fi
          "$RUNNER_TEMP/pkg" check templates/app

      - name: Builds are reproducible
        run: node scripts/packages.mjs reproducible --pkg="$RUNNER_TEMP/pkg"
