title: Review count
description: Capture the current book quantity and record the discrepancy without moving stock.
from: [draft]
roles: [keeper]
inputs:
  - {name: bookqty, title: Book quantity at review, type: decimal, required: true}
transaction:
  guard: "countedon <= today()"
  message: Count date or current book quantity is unavailable.
  steps:
    - target: $subject
      set: {bookqty: input.bookqty, difference: "counted - input.bookqty", reviewedat: "now()", state: "'reviewed'"}
