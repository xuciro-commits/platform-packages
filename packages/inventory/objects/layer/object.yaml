name: layer
namespace: inventory
title: Valuation layer
plural: Valuation layers
icon: queue-list
display: origin
ledger: true
fields:
  - {name: material, title: Item, type: reference, ref: item.master, required: true}
  - {name: warehouse, title: Warehouse, type: reference, ref: inventory.warehouse, required: true}
  - {name: origin, title: Inbound movement, type: reference, ref: inventory.movement, required: true}
  - {name: consumer, title: Consuming movement, type: reference, ref: inventory.movement, inverse: consumedlayers, required: true}
  - {name: quantity, title: Quantity in base unit, type: decimal, required: true}
  - {name: amount, title: Valuation amount, type: decimal, required: true}
  - {name: on, title: Business date, type: date, required: true, default: today}
  - {name: reverses, title: Reverses, type: reference, ref: inventory.layer, readOnly: true}
  - {name: reversed, title: Reversed, type: boolean, readOnly: true}
balances:
  - name: remaining
    title: Remaining valuation layers
    keys: [material, warehouse, origin]
    measures: [quantity, amount]
    fields:
      - {name: unitcost, title: Unit cost, type: decimal, live: "if(quantity > 0, round(amount / quantity, 4), 0)"}
    access:
      - {role: reader, read: all}
      - {role: keeper, read: all}
    constraints:
      - name: nonneg
        kind: expression
        expr: "quantity >= 0"
        message: Insufficient remaining FIFO layer quantity.
  - name: allocation
    title: Consumed valuation layers
    keys: [consumer, origin]
    measures: [quantity, amount]
    access:
      - {role: reader, read: all}
      - {role: keeper, read: all}
access:
  - {role: reader, read: all}
  - {role: keeper, read: all, create: true}
view:
  version: 1
  layout: table
  columns: [on, material, warehouse, origin, consumer, quantity, amount, reversed, reverses]
  sort: [{sortKey: on, direction: descending}]
  group: warehouse
  lanes: ""
  filters: []
  search: ""
  dates: on
