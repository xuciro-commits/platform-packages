name: position
namespace: inventory
title: Stock position
plural: Stock positions
icon: map-pin
display: title
sets:
  incoming: {object: inventory.movement, limit: 500}
  outgoing: {object: inventory.movement, limit: 500}
  reservations: {object: inventory.reservation, limit: 500}
fields:
  - {name: title, title: Location label, type: text, required: true}
  - {name: warehouse, title: Warehouse, type: reference, ref: inventory.warehouse}
  - {name: item, title: Item, type: reference, ref: item.master, required: true}
  - {name: balance, title: On hand, type: decimal, formula: "sum(incoming, if((item.state = 'posted' or item.state = 'reversed'), item.quantity, 0)) - sum(outgoing, if((item.state = 'posted' or item.state = 'reversed'), item.quantity, 0))"}
  - {name: available, title: Available, type: decimal, formula: "balance - sum(reservations, if(item.state = 'reserved', item.quantity, 0))"}
constraints:
  - name: positionidentity
    kind: unique
    fields: [title, item]
    message: This item already has a position at this location.
    translations:
      zh-CN: 此物料在该位置已有库存记录。
  - name: storageonly
    kind: expression
    fields: [warehouse]
    expr: "warehouse = empty or coalesce(warehouse.nodekind, 'storage') = 'storage'"
    message: Select a storage warehouse, not a group.
    translations:
      zh-CN: 请选择实体仓库而不是仓库分组。
access:
  - {role: reader, read: all}
  - {role: keeper, read: all, create: true}
view: {version: 1, layout: table, columns: [title, warehouse, item, balance, available], sort: [], group: item, lanes: "", filters: [], search: ""}
