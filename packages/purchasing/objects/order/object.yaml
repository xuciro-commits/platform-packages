name: order
namespace: purchasing
title: Purchase order
plural: Purchase orders
icon: shopping-cart
display: title
naming: PO-{year}-{n:5}
sets:
  lines: {object: purchasing.orderline, limit: 500}
  receipts: {object: purchasing.receipt, limit: 200}
fields:
  - {name: title, title: Reference, type: text, required: true, search: true, group: Order}
  - {name: supplier, title: Supplier, type: reference, ref: purchasing.supplier, required: true, group: Order}
  - {name: sourcekind, title: Order source kind, type: choice, required: true, default: manual, choices: "manual:Manual order,quote:From quotation", group: Order}
  - {name: sourcequote, title: Source quotation, type: reference, ref: purchasing.quotation, group: Order}
  - {name: currency, title: Currency, type: choice, required: true, choices: "CNY:CNY,USD:USD,EUR:EUR", group: Order}
  - {name: orderedon, title: Order date, type: date, required: true, group: Order}
  - {name: expectedon, title: Expected on, type: date, required: true, group: Order}
  - {name: confirmationno, title: Supplier confirmation number, type: text, group: Order}
  - {name: confirmationdate, title: Confirmation date, type: date, group: Order}
  - {name: terms, title: Terms, type: longtext, group: Commercial}
  - {name: remarks, title: Remarks, type: longtext, group: Commercial}
  - {name: total, title: Net amount, type: decimal, formula: sum(lines.amount), group: Totals}
  - {name: invalidlines, title: Inactive item lines, type: integer, formula: "sum(lines, if(item.itemstate = 'active', 0, 1))", group: Totals}
  - {name: linecount, title: Line count, type: integer, formula: count(lines), group: Totals}
states:
  - {name: draft, title: Draft, tone: neutral}
  - {name: approved, title: Approved, tone: success}
  - {name: cancelled, title: Cancelled, tone: neutral}
actions: [approve, cancel, revise]
constraints:
  - {name: dates, kind: expression, fields: [orderedon, expectedon], expr: "expectedon >= orderedon", message: Expected date cannot precede order date.}
  - {name: sourceidentity, kind: unique, fields: [sourcequote], message: A draft or historical order already exists for this quotation.}
  - {name: sourcemode, kind: expression, fields: [sourcekind, sourcequote], expr: "(sourcekind = 'manual' and sourcequote = empty) or (sourcekind = 'quote' and sourcequote != empty)", message: Select a quotation only for a sourced order.}
createTransaction:
  guard: "sourcekind = 'manual' or (sourcequote.state = 'recorded' and sourcequote.mode = 'single' and sourcequote.validuntil >= today() and sourcequote.validuntil >= orderedon and sourcequote.quotedon <= orderedon and sourcequote.rfq.supplier = supplier and sourcequote.currency = currency and supplier.state = 'qualified' and sourcequote.rfq.request.state = 'approved' and sourcequote.rfq.request.material.state = 'active')"
  message: Sourced order requires a valid recorded single quote with matching supplier and currency.
  steps:
    - target: $subject
      set: {sourcekind: sourcekind}
access:
  - {role: reader, read: all}
  - {role: buyer, read: all, create: true}
  - {role: manager, read: all, create: true}
view:
  version: 1
  layout: table
  columns: [title, supplier, sourcekind, sourcequote, orderedon, expectedon, currency, total, state]
  sort: [{sortKey: expectedon, direction: ascending}]
  group: state
  lanes: ""
  filters: []
  search: ""
  print: {title: Purchase order, fields: [title, supplier, orderedon, expectedon, currency, linecount, total]}
