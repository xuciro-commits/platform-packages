title: Post receipt
description: Record the purchase receipt and post inbound stock movements and general ledger vouchers when connected.
from: [draft]
roles: [buyer, manager]
uses: [stock.post/1#post, gl.post/1#post]
transaction:
  reads:
    collections:
      lines: {app: build, object: purchasing.receiptline, policy: complete, query: "", set: lines, version: 0}
  guard: "count(lines) > 0 and supplier.state = 'qualified' and sum(lines, if(item.material.state = 'active', 0, 1)) = 0"
  message: Receipt requires a qualified supplier and at least one active item line.
  steps:
    - target: $subject
      set: {state: "'posted'", postingerror: "''"}
    - name: postlines
      forEach:
        set: lines
        steps:
          - name: markline
            target: $item
            set: {posted: true}
          - name: stockin
            request: stock.post/1#post
            deferred: true
            optional: true
            key: row.id
            reply: postreply
            with:
              title: title
              material: row.material
              warehouse: coalesce(row.warehouse, warehouse)
              quantity: row.quantity
              amount: row.amount
              on: receivedon
              sourcetype: "'purchasing.receipt'"
              sourceid: row.receipt
    - name: postgl
      when: "sum(lines.amount) > 0"
      request: gl.post/1#post
      deferred: true
      optional: true
      key: "concat('GL-RCV-', id)"
      reply: postreply
      with:
        book: "'DEFAULT'"
        title: title
        rule: "'PURCHASE_RECEIPT'"
        amount: "sum(lines.amount)"
        taxamount: 0
        inventorydelta: "sum(lines.amount)"
        on: receivedon
        sourcetype: "'purchasing.receipt'"
        sourceid: id
