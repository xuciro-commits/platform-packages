title: Open quotation request
from: [draft]
roles: [buyer, manager]
transaction:
  guard: "request.state = 'approved' and request.mode = 'single' and request.material.state = 'active' and coalesce(issuedon, today()) <= today() and supplier.state = 'qualified' and deadline >= today()"
  message: An approved single-item requisition with active item, qualified supplier and valid invitation dates is required.
  steps:
    - target: $subject
      set: {state: "'open'"}
