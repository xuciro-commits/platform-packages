name: quotation
namespace: purchasing
title: Supplier quotation
plural: Supplier quotations
icon: document-text
display: title
naming: SQ-{year}-{n:5}
sets:
  lines: {object: purchasing.quotationline, limit: 500}
fields:
  - {name: title, title: Reference, type: text, required: true, search: true}
  - {name: rfq, title: Request for quotation, type: reference, ref: purchasing.rfq, required: true}
  - {name: supplier, title: Supplier, type: reference, ref: purchasing.supplier, from: rfq.supplier}
  - {name: mode, title: Request entry mode, type: choice, required: true, default: single, choices: "single:Single item,multi:Multiple items"}
  - {name: quantity, title: Base quantity, type: decimal}
  - {name: unitprice, title: Unit price, type: decimal}
  - {name: currency, title: Currency, type: choice, required: true, choices: "CNY:CNY,USD:USD,EUR:EUR"}
  - {name: discountpercent, title: Discount percent, type: decimal, default: "0"}
  - {name: grossamount, title: Gross amount, type: decimal, formula: "if(mode = 'single', quantity * unitprice, sum(lines, if(item.state = 'active', item.grossamount, 0)))"}
  - {name: discountamount, title: Discount amount, type: decimal, formula: "grossamount - total"}
  - {name: total, title: Net amount, type: decimal, formula: "if(mode = 'single', quantity * unitprice * (100 - coalesce(discountpercent, 0)) / 100, sum(lines, if(item.state = 'active', item.amount, 0)))"}
  - {name: draftorder, title: Generated order draft, type: reference, ref: purchasing.order, readOnly: true}
  - {name: draftorderline, title: Generated order line, type: reference, ref: purchasing.orderline, readOnly: true}
  - {name: vendorref, title: Supplier quotation reference, type: text, search: true}
  - {name: terms, title: Terms, type: longtext}
  - {name: quotedon, title: Quoted on, type: date, required: true}
  - {name: validuntil, title: Valid until, type: date, required: true}
states:
  - {name: draft, title: Draft, tone: neutral}
  - {name: recorded, title: Recorded quote, tone: success}
  - {name: withdrawn, title: Withdrawn, tone: neutral}
actions: [record, withdraw, revise, setdiscount, revisecommercial, makeorder]
constraints:
  - {name: commercial, kind: expression, fields: [quantity, unitprice], expr: "(mode = 'single' and quantity != empty and unitprice != empty and quantity > 0 and unitprice >= 0) or (mode = 'multi' and quantity = empty and unitprice = empty)", message: Single quotation uses header quantity and price; multi quotation uses lines.}
  - {name: validity, kind: expression, fields: [quotedon, validuntil], expr: "validuntil >= quotedon", message: Validity must end on or after quotation date.}
  - {name: discountbounds, kind: expression, fields: [mode, discountpercent], expr: "coalesce(discountpercent, 0) >= 0 and coalesce(discountpercent, 0) <= 100 and (mode = 'single' or coalesce(discountpercent, 0) = 0)", message: Header discount is only available for single-item quotations.}
createTransaction:
  guard: "mode = rfq.request.mode and draftorder = empty and draftorderline = empty"
  message: Quote mode must match invitation demand mode and generated order links must be empty on creation.
  steps:
    - target: $subject
      set: {mode: mode}
access:
  - {role: buyer, read: all, create: true}
  - {role: manager, read: all, create: true}
view: {version: 1, layout: table, columns: [title, supplier, rfq, mode, quantity, unitprice, currency, grossamount, discountamount, total, validuntil, state], sort: [], group: state, lanes: "", filters: [], search: ""}
