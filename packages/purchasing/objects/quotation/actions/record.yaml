title: Record quotation
from: [draft]
roles: [buyer, manager]
transaction:
  guard: "rfq.state = 'open' and rfq.deadline >= today() and rfq.supplier.state = 'qualified' and quotedon <= today() and validuntil >= today()"
  message: Quote is outside the active invitation or validity window.
  steps:
    - target: $subject
      set: {state: "'recorded'"}
