name: orderline
namespace: purchasing
title: Purchase order line
plural: Purchase order lines
icon: cube
display: material
naming: POL-{n:6}
fields:
  - {name: order, title: Purchase order, type: reference, ref: purchasing.order, inverse: lines, required: true}
  - {name: material, title: Item, type: reference, ref: item.master, required: true}
  - {name: itemstate, title: Item status, type: choice, from: material.state, choices: "active:Active,inactive:Inactive"}
  - {name: description, title: Line description, type: longtext}
  - {name: expectedon, title: Line expected delivery, type: date}
  - {name: quantity, title: Base quantity, type: decimal, required: true}
  - {name: unitprice, title: Unit price, type: decimal, required: true}
  - {name: amount, title: Net amount, type: decimal, formula: "quantity * unitprice"}
constraints:
  - {name: commercial, kind: expression, fields: [quantity, unitprice], expr: "quantity > 0 and unitprice >= 0", message: Quantity and price are invalid.}
createTransaction:
  guard: "order.state = 'draft' and material.state = 'active'"
  message: Only draft orders accept new lines for active items.
  steps:
    - target: $subject
      set: {quantity: quantity}
access:
  - {role: buyer, read: all, create: true}
  - {role: manager, read: all, create: true}
view: {version: 1, layout: table, columns: [order, material, quantity, unitprice, amount], sort: [], group: none, lanes: "", filters: [], search: ""}
