name: dealline
namespace: crm
title: Deal product
plural: Deal products
icon: cube
display: product
naming: DL-{n:6}

fields:
  - {name: deal, title: Deal, type: reference, ref: crm.deal, inverse: lines, required: true}
  - {name: product, title: Product, type: reference, ref: crm.product, required: true, search: true}
  - {name: quantity, title: Quantity, type: integer, default: "1"}
  - {name: price, title: Unit price, type: money, from: product.price}
  - {name: discount, title: Discount %, type: integer}
  - {name: amount, title: Amount, type: money, formula: "quantity * price - quantity * price * coalesce(discount, 0) / 100"}

ask: {archive: 'Archiving moves this record out of active views.'}

access:
  - {role: salesrep, read: team, create: true, edit: true}
  - {role: salesmanager, read: all, create: true, edit: true, archive: true}

view: {version: 1, layout: table, columns: [product, deal, quantity, price, discount, amount], sort: [], group: none, lanes: "", filters: [], search: ""}
