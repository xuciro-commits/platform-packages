name: lead
namespace: crm
type: crm.lead
title: Lead
plural: Leads
display: fullname
fields:
- name: fullname
  title: Full name
  type: text
  required: true
  search: true
  group: Contact
- name: company
  title: Company
  type: text
  search: true
  group: Contact
- name: jobtitle
  title: Job title
  type: text
  group: Contact
- name: email
  title: Email
  type: text
  search: true
  group: Contact
- name: mobile
  title: Mobile
  type: text
  search: true
  group: Contact
- name: phone
  title: Phone
  type: text
  group: Contact
- name: website
  title: Website
  type: text
  group: Contact
- name: linkedin
  title: LinkedIn
  type: text
  group: Contact
- name: source
  title: Source
  type: reference
  ref: crm.source
  group: Company
- name: industry
  title: Industry
  type: reference
  ref: crm.industry
  group: Company
- name: territory
  title: Territory
  type: reference
  ref: crm.territory
  group: Company
- name: employees
  title: Employees
  type: choice
  choices: 1-10:1-10,11-50:11-50,51-200:51-200,201-500:201-500,501-1000:501-1000,1000+:1000+
  group: Company
- name: need
  title: Need
  type: longtext
  group: Qualification
  help: What problem do they want to solve, and why now?
- name: budget
  title: Budget
  type: money
  default: setting:currency
  group: Qualification
- name: timeframe
  title: Timeframe
  type: choice
  group: Qualification
  choices: month:This month,quarter:This quarter,half:Within six months,later:Later,unknown:Unknown
- name: authority
  title: Decision role
  type: choice
  group: Qualification
  choices: decisionmaker:Decision maker,influencer:Influencer,user:User,unknown:Unknown
- name: deal
  title: Deal
  type: reference
  ref: crm.deal
  readOnly: true
  group: Outcome
  when: state=converted
- name: disqualifyreason
  title: Disqualify reason
  type: reference
  ref: crm.disqualifyreason
  readOnly: true
  group: Outcome
  when: state=disqualified
- name: outcomenotes
  title: Outcome notes
  type: longtext
  readOnly: true
  group: Outcome
  when: state=converted,disqualified
- name: stage
  title: Follow-up
  type: choice
  choices: new:New,attempting:Attempting,connected:Connected,nurturing:Nurturing
  default: new
  aside: true
- name: owner
  title: Lead owner
  type: member
  aside: true
- name: responseby
  title: Respond by
  type: datetime
  default: now+4h
  aside: true
- name: sla
  title: Response time
  type: choice
  choices: due:Due,met:Met,missed:Missed
  default: due
  aside: true
view:
  columns:
  - fullname
  - company
  - stage
  - source
  - owner
  - sla
  - responseby
  filters: []
  group: none
  lanes: stage
  layout: table
  search: ''
  sort:
  - direction: ascending
    sortKey: responseby
  version: 1
  inbox:
    member: owner
    due: responseby
    open:
      stage:
      - new
access:
- role: salesrep
  read: team
  create: true
  edit: true
- role: salesmanager
  read: all
  create: true
  edit: true
  archive: true
naming: LEAD-{year}-{n:5}
scope:
  owner: owner
states:
- name: open
  title: Open
  tone: info
  description: Being worked.
- name: converted
  title: Converted
  tone: success
  description: Became a deal.
- name: disqualified
  title: Disqualified
  tone: danger
  description: Not worth pursuing.
actions:
- name: convert
  title: Convert to deal
  from:
  - open
  open: deal
  description: Create the account, contact and deal from this lead in one step; link existing ones instead when they already exist.
  inputs:
  - name: account
    title: Existing account
    type: reference
    ref: crm.account
    help: Leave empty to create a new account from the company name.
  - name: contact
    title: Existing contact
    type: reference
    ref: crm.contact
    help: Leave empty to create a new contact from the lead.
  - name: title
    title: Deal name
    type: text
    help: Defaults to the company name.
  - name: expectedclose
    title: Expected close
    type: date
    required: true
  - name: nextstep
    title: Next step
    type: text
    required: true
  - name: nextstepdue
    title: Next step due
    type: date
    required: true
  transaction:
    subject: crm.lead
    guard:
      op: not
      kind: boolean
      args:
      - op: empty
        kind: boolean
        args:
        - op: ''
          kind: money
          ref: budget
    message: Fill in the budget before converting; it becomes the deal amount.
    steps:
    - name: account
      kind: create
      target:
        type: crm.account
      when:
        op: empty
        kind: boolean
        args:
        - op: ''
          kind: reference
          ref: input.account
      changes:
      - field: name
        expr:
          op: coalesce
          kind: text
          args:
          - op: ''
            kind: text
            ref: company
          - op: ''
            kind: text
            ref: fullname
      - field: website
        expr:
          op: ''
          kind: text
          ref: website
      - field: industry
        expr:
          op: ''
          kind: reference
          ref: industry
      - field: territory
        expr:
          op: ''
          kind: reference
          ref: territory
      - field: employees
        expr:
          op: ''
          kind: choice
          ref: employees
      - field: owner
        expr:
          op: ''
          kind: text
          ref: owner
    - name: contact
      kind: create
      target:
        type: crm.contact
      when:
        op: empty
        kind: boolean
        args:
        - op: ''
          kind: reference
          ref: input.contact
      changes:
      - field: fullname
        expr:
          op: ''
          kind: text
          ref: fullname
      - field: account
        expr:
          op: coalesce
          kind: reference
          args:
          - op: ''
            kind: reference
            ref: input.account
          - op: ''
            kind: reference
            ref: step.account
      - field: jobtitle
        expr:
          op: ''
          kind: text
          ref: jobtitle
      - field: email
        expr:
          op: ''
          kind: text
          ref: email
      - field: mobile
        expr:
          op: ''
          kind: text
          ref: mobile
      - field: phone
        expr:
          op: ''
          kind: text
          ref: phone
      - field: linkedin
        expr:
          op: ''
          kind: text
          ref: linkedin
      - field: owner
        expr:
          op: ''
          kind: text
          ref: owner
    - name: deal
      kind: create
      target:
        type: crm.deal
      changes:
      - field: title
        expr:
          op: coalesce
          kind: text
          args:
          - op: ''
            kind: text
            ref: input.title
          - op: ''
            kind: text
            ref: company
          - op: ''
            kind: text
            ref: fullname
      - field: account
        expr:
          op: coalesce
          kind: reference
          args:
          - op: ''
            kind: reference
            ref: input.account
          - op: ''
            kind: reference
            ref: step.account
      - field: contact
        expr:
          op: coalesce
          kind: reference
          args:
          - op: ''
            kind: reference
            ref: input.contact
          - op: ''
            kind: reference
            ref: step.contact
      - field: lead
        from: $subject
      - field: source
        expr:
          op: ''
          kind: reference
          ref: source
      - field: amount
        expr:
          op: ''
          kind: money
          ref: budget
      - field: expectedclose
        expr:
          op: ''
          kind: date
          ref: input.expectedclose
      - field: nextstep
        expr:
          op: ''
          kind: text
          ref: input.nextstep
      - field: nextstepdue
        expr:
          op: ''
          kind: date
          ref: input.nextstepdue
      - field: stage
        expr:
          op: ''
          kind: reference
          lit:
            value: qualification
      - field: owner
        expr:
          op: ''
          kind: text
          ref: owner
    - name: stakeholder
      kind: create
      target:
        type: crm.dealcontact
      changes:
      - field: deal
        expr:
          op: ''
          kind: reference
          ref: step.deal
      - field: contact
        expr:
          op: coalesce
          kind: reference
          args:
          - op: ''
            kind: reference
            ref: input.contact
          - op: ''
            kind: reference
            ref: step.contact
      - field: role
        expr:
          op: if
          kind: choice
          args:
          - op: '='
            kind: boolean
            args:
            - op: ''
              kind: choice
              ref: authority
            - op: ''
              kind: choice
              lit:
                value: decisionmaker
          - op: ''
            kind: choice
            lit:
              value: decisionmaker
          - op: ''
            kind: choice
            lit:
              value: champion
    - name: subject
      kind: update
      target:
        type: crm.lead
        id: $subject
      changes:
      - field: state
        expr:
          op: ''
          kind: choice
          lit:
            value: converted
      - field: deal
        expr:
          op: ''
          kind: reference
          ref: step.deal
- name: disqualify
  title: Disqualify
  from:
  - open
  description: Close this lead as not worth pursuing.
  inputs:
  - name: reason
    title: Reason
    type: reference
    ref: crm.disqualifyreason
    required: true
  - name: notes
    title: Notes
    type: longtext
  transaction:
    subject: crm.lead
    steps:
    - name: subject
      kind: update
      target:
        type: crm.lead
        id: $subject
      changes:
      - field: state
        expr:
          op: ''
          kind: choice
          lit:
            value: disqualified
      - field: disqualifyreason
        expr:
          op: ''
          kind: reference
          ref: input.reason
      - field: outcomenotes
        expr:
          op: ''
          kind: text
          ref: input.notes
- name: reopen
  title: Reopen
  from:
  - disqualified
  description: Work this lead again.
  transaction:
    subject: crm.lead
    steps:
    - name: subject
      kind: update
      target:
        type: crm.lead
        id: $subject
      changes:
      - field: state
        expr:
          op: ''
          kind: choice
          lit:
            value: open
