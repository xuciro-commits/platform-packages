name: dealcontact
namespace: crm
title: Deal contact
plural: Deal contacts
icon: user-circle
display: contact
naming: DC-{n:6}

fields:
  - {name: deal, title: Deal, type: reference, ref: crm.deal, inverse: stakeholders, required: true}
  - {name: contact, title: Contact, type: reference, ref: crm.contact, inverse: deals, required: true, search: true}
  - {name: role, title: Role, type: choice, required: true, choices: "decisionmaker:Decision maker,champion:Champion,influencer:Influencer,user:User,blocker:Blocker"}
  - {name: notes, title: Notes, type: longtext}

access:
  - {role: salesrep, read: team, create: true, edit: true}
  - {role: salesmanager, read: all, create: true, edit: true, archive: true}

view: {version: 1, layout: table, columns: [contact, deal, role], sort: [], group: none, lanes: "", filters: [], search: ""}
