name: activity
namespace: crm
title: Activity
plural: Activities
icon: calendar-days
display: subject
naming: ACT-{year}-{n:5}
scope: {owner: assignee}

fields:
  - {name: subject, title: Subject, type: text, required: true, search: true}
  - {name: kind, title: Type, type: choice, default: call, choices: "call:Call,meeting:Meeting,email:Email,demo:Demo,todo:To-do"}
  - {name: lead, title: Lead, type: reference, ref: crm.lead, oneOf: Related to, inverse: activities}
  - {name: deal, title: Deal, type: reference, ref: crm.deal, oneOf: Related to, inverse: activities}
  - {name: account, title: Account, type: reference, ref: crm.account, oneOf: Related to, inverse: activities}
  - {name: contact, title: Contact, type: reference, ref: crm.contact, oneOf: Related to, inverse: activities}
  - {name: due, title: Due, type: date, default: today}
  - {name: details, title: Details, type: longtext}
  - {name: outcome, title: Outcome, type: longtext, readOnly: true, when: state=done}
  - {name: priority, title: Priority, type: choice, default: normal, aside: true, choices: "low:Low,normal:Normal,high:High"}
  - {name: assignee, title: Assigned to, type: member, default: member, aside: true}

states:
  - {name: open, title: To do, tone: info, description: Still to be done.}
  - {name: done, title: Done, tone: success, description: "Done, with its outcome."}
  - {name: canceled, title: Canceled, tone: neutral, description: No longer needed.}
actions: [dial, complete, cancel, reopen]

ask: {archive: 'Archiving moves this record out of active views.'}

access:
  - {role: salesrep, read: team, create: true, edit: true}
  - {role: salesmanager, read: all, create: true, edit: true, archive: true}

view:
  version: 1
  layout: calendar
  dates: due
  columns: [subject, kind, due, priority, assignee, deal, lead, account]
  sort: [{sortKey: due, direction: ascending}]
  lanes: kind
  group: none
  filters: []
  search: ""
  inbox: {member: assignee, due: due, open: {state: [open]}}
