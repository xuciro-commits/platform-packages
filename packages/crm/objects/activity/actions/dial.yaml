title: Call
description: Call the contact or lead of this activity through the tenant's phone service; the call shows up in the call bar.
from: [open]
ask: 'Calling dials an external phone number immediately.'
uses: [call/1#dial]
transaction:
  steps:
    - request: call/1#dial
      with:
        number: coalesce(contact.base.mobile, contact.base.phone, lead.mobile, lead.phone)
        reference: concat('crm.activity/', id)
