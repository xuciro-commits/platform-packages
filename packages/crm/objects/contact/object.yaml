name: contact
namespace: crm
title: Contact
plural: Contacts
icon: identification
display: title
naming: CON-{n:5}
extends: party.contact
description: The sales side of a business partner contact. Their name, organization, job title and ways to reach them are kept once in Business partners.
scope: {owner: owner}

fields:
  - {name: base, title: Person, type: reference, ref: party.contact, required: true, search: true, group: Contact}
  - {name: title, title: Full name, type: text, from: base.fullname, search: true, group: Contact}
  - {name: account, title: Account, type: reference, ref: crm.account, inverse: contacts, search: true, group: Contact}
  - {name: linkedin, title: LinkedIn, type: text, group: Contact}
  - {name: background, title: Background, type: longtext, group: Contact}
  - {name: owner, title: Contact owner, type: member, default: member, aside: true}

access:
  - {role: salesrep, read: all, create: true, edit: true}
  - {role: salesmanager, read: all, create: true, edit: true, archive: true}

view:
  version: 1
  layout: table
  columns: [title, account, owner]
  sort: [{sortKey: title, direction: ascending}]
  group: account
  lanes: ""
  filters: []
  search: ""
