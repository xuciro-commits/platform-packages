roles:
  crm: salesmanager
at: 2026-11-23T09:00:00Z
steps:
  - do: crm.lead.create
    on: crm.lead/L1
    with: {fullname: Zhou Ning, company: Xihe Precision, email: zhou@xihe.example, mobile: "+8613800138000", source: website, authority: decisionmaker, budget: {amount: 300000, currency: CNY}}
    show: [stage, owner, budget]
  - do: crm.lead.edit
    on: crm.lead/L1
    with: {stage: connected}
    show: [stage, sla]
    expect: {sla: met}
  - do: crm.lead.create
    on: crm.lead/L3
    with: {fullname: Web Visitor, source: website}
    show: [owner, sla]
  - do: crm.lead.convert
    on: crm.lead/L1
    with: {expectedclose: "2026-12-31", nextstep: Send the proposal, nextstepdue: "2026-11-25"}
    show: [stage, state, deal]
    expect: {state: converted}
  - read: crm.deal/{crm.lead/L1.deal}
    show: [stage, account, contact, amount]
  - read: crm.account/ACC-00001
    show: [title, base, owner]
    expect: {title: Xihe Precision}
  - read: crm.contact/CON-00001
    show: [title, account]
    expect: {title: Zhou Ning, account: ACC-00001}
  - do: crm.account.create
    on: crm.account/A2
    with: {base: demo-crm-org-1}
    refused: true
  - do: crm.lead.create
    on: crm.lead/L4
    with: {fullname: Gao Yan, company: Northwind Precision Manufacturing, email: gao@northwind.example, budget: {amount: 90000, currency: CNY}}
  - do: crm.lead.convert
    on: crm.lead/L4
    with: {account: demo-account-1, expectedclose: "2026-12-31", nextstep: Book the demo, nextstepdue: "2026-11-30"}
    show: [state, deal]
    expect: {state: converted}
  - read: crm.deal/{crm.lead/L4.deal}
    show: [account, contact]
    expect: {account: demo-account-1}
  - read: crm.contact/CON-00002
    show: [title, account, base]
    expect: {title: Gao Yan, account: demo-account-1}
  - read: party.contact/{crm.contact/CON-00002.base}
    show: [fullname, organization]
    expect: {fullname: Gao Yan, organization: demo-crm-org-1}
  - do: crm.product.create
    on: crm.product/P1
    with: {title: Platform licence, price: {amount: 120000, currency: CNY}}
    show: [price]
  - do: crm.dealline.create
    on: crm.dealline/DL1
    with: {deal: "{crm.lead/L1.deal}", product: P1, quantity: 3, discount: 10}
    show: [amount]
    expect: {amount: {amount: 324000, currency: CNY}}
  - do: crm.deal.win
    on: crm.deal/{crm.lead/L1.deal}
    with: {notes: Best fit}
    show: [stage, state]
    expect: {state: won}
  - do: crm.lead.create
    on: crm.lead/L2
    with: {fullname: Spam Bot}
    show: [stage, state]
  - do: crm.lead.disqualify
    on: crm.lead/L2
    with: {reason: spam}
    show: [stage, state]
    expect: {state: disqualified}
  - do: crm.lead.convert
    on: crm.lead/L2
    with: {expectedclose: "2026-12-31"}
    refused: true
  - read: crm.deal/demo-deal-1
    show: [title, stage]
    expect: {stage: negotiation}
  - read: crm.deal/demo-deal-5
    show: [state, closedate]
    expect: {state: won}
  - read: crm.deal/demo-deal-6
    show: [state, lostreason]
    expect: {state: lost, lostreason: competitor}
  - do: platform.package.clear-demo
    on: platform.package/crm
    with: {id: crm}
  - do: platform.package.clear-demo
    on: platform.package/crm
    with: {id: crm}
    refused: true
  - read: crm.deal/demo-deal-1
    show: [archived]
    expect: {archived: true}
  - do: crm.lead.create
    on: crm.lead/DIAL1
    with: {fullname: Gao Yan, mobile: "+8613900139000", source: website}
  - do: crm.lead.dial
    on: crm.lead/DIAL1
    refused: true
  - do: crm.contact.dial
    on: crm.contact/CON-00001
    refused: true
