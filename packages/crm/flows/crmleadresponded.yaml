name: build.crmleadresponded
subject:
  app: build
  kind: object
  name: crm.lead
actions:
- app: build
  kind: action
  name: crm.lead.edit
definition:
  name: crmleadresponded
  title: Record the first response
  kind: automation
  object: crm.lead
  trigger:
    op: and
    kind: boolean
    args:
    - op: not
      kind: boolean
      args:
      - op: '='
        kind: boolean
        args:
        - op: ''
          kind: json
          ref: subject.stage
        - op: ''
          kind: json
          lit:
            value: new
    - op: '='
      kind: boolean
      args:
      - op: ''
        kind: json
        ref: subject.sla
      - op: ''
        kind: json
        lit:
          value: due
  steps:
  - name: respond
    kind: action
    act: edit
    inputs:
      sla:
        source: literal
        value: met
