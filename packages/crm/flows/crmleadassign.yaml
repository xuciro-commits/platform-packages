name: build.crmleadassign
subject: {app: build, kind: object, name: crm.lead}
actions: [{app: build, kind: action, name: crm.lead.edit}]
definition:
  name: crmleadassign
  title: Assign new leads evenly
  kind: automation
  object: crm.lead
  trigger: empty(subject.owner) and subject.stage = 'new'
  steps:
    - name: assign
      kind: action
      act: edit
      balance:
        owner: {app: crm, role: salesrep, open: {stage: [new, attempting, connected, nurturing]}}
