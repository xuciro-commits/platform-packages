title: Post delivery
description: Post the delivery note, post outbound stock movements with cost valuation, and release order reservations.
from: [draft]
roles: [rep, manager]
uses: [stock.post/1#post, stock.reserve/1#release]
transaction:
  reads:
    collections:
      lines: {app: build, object: sales.deliveryline, policy: complete, query: "", set: lines, version: 0}
  guard: "count(lines) > 0 and customer.state = 'active' and (order = empty or order.state = 'confirmed') and sum(lines, if(item.material.state = 'active', 0, 1)) = 0"
  message: Delivery note requires an active customer, at least one active item line, and a confirmed sales order when linked.
  steps:
    - target: $subject
      set: {state: "'posted'"}
    - name: postlines
      forEach:
        set: lines
        steps:
          - name: markline
            target: $item
            set: {posted: true}
          - name: stockoutorder
            when: "order != empty"
            request: stock.post/1#post
            deferred: true
            optional: true
            key: "concat('DN-', row.id)"
            reply: postreply
            with:
              title: "concat(title, '-', row.id)"
              material: row.material
              warehouse: "coalesce(row.warehouse, warehouse)"
              quantity: "0 - row.quantity"
              on: postedon
              sourcetype: "'sales.order'"
              sourceid: order
          - name: stockoutdirect
            when: "order = empty"
            request: stock.post/1#post
            deferred: true
            optional: true
            key: "concat('DN-', row.id)"
            reply: postreply
            with:
              title: "concat(title, '-', row.id)"
              material: row.material
              warehouse: "coalesce(row.warehouse, warehouse)"
              quantity: "0 - row.quantity"
              on: postedon
              sourcetype: "'sales.delivery'"
              sourceid: id
          - name: releaseline
            when: "row.orderline != empty and coalesce(row.orderline.reservationkey, '') != ''"
            request: stock.reserve/1#release
            deferred: true
            optional: true
            key: row.orderline.reservationkey
