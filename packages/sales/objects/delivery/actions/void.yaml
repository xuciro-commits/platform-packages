ask: Reversing a posted delivery note reverses its outbound stock movements and COGS voucher.
title: Reverse delivery
description: Reverse a posted delivery note and reverse its outbound stock movements and COGS voucher when connected.
from: [posted]
roles: [manager]
uses: [stock.post/1#reverse, gl.post/1#reverse]
inputs:
  - {name: on, title: Reversal date, type: date}
transaction:
  reads:
    collections:
      lines: {app: build, object: sales.deliveryline, policy: complete, query: "", set: lines, version: 0}
  steps:
    - target: $subject
      set: {state: "'reversed'"}
    - name: voidlines
      forEach:
        set: lines
        steps:
          - name: unmarkline
            target: $item
            set: {posted: false}
          - name: stockrev
            request: stock.post/1#reverse
            deferred: true
            optional: true
            key: "concat('DN-', row.id)"
            with:
              on: "coalesce(input.on, today())"
    - name: voidgl
      when: "coalesce(glqueued, false)"
      request: gl.post/1#reverse
      deferred: true
      optional: true
      key: "concat('GL-DN-', id)"
      with:
        on: "coalesce(input.on, today())"
