title: Post invoice
description: Post the sales invoice to record customer receivable and sales revenue facts and emit a general ledger voucher when connected.
from: [draft]
roles: [rep, manager]
uses: [gl.post/1#post]
transaction:
  reads:
    collections:
      lines: {app: build, object: sales.invoiceline, policy: complete, query: "", set: lines, version: 0}
  guard: "count(lines) > 0 and customer.state = 'active' and sum(lines, if(item.material.state = 'active', 0, 1)) = 0"
  message: Sales invoice requires an active customer and at least one active item line.
  steps:
    - target: $subject
      set: {state: "'posted'"}
    - name: postgl
      when: "sum(lines.amount) > 0"
      request: gl.post/1#post
      deferred: true
      optional: true
      key: "concat('GL-SINV-', id)"
      with:
        book: "'DEFAULT'"
        title: title
        rule: "'SALES_REVENUE'"
        amount: "sum(lines.amount)"
        taxamount: "sum(lines.taxamount)"
        inventorydelta: 0
        on: postedon
        sourcetype: "'sales.invoice'"
        sourceid: id
