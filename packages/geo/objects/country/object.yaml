name: country
namespace: geo
title: Country or region
plural: Countries and regions
icon: flag
display: name
description: A country or region with its ISO 3166-1 codes. Names come from the Unicode CLDR.

fields:
  - {name: name, title: Name, type: text, required: true, search: true}
  - {name: code, title: Code, type: text, required: true, search: true, help: The two-letter ISO 3166-1 code.}
  - {name: alpha3, title: Three-letter code, type: text, search: true}
  - {name: numeric, title: Numeric code, type: text}

access:
  - {role: user, read: all}
  - {role: steward, read: all, create: true, edit: true, archive: true}

view: {version: 1, layout: table, columns: [name, code, alpha3, numeric], sort: [{sortKey: name, direction: ascending}], group: none, lanes: "", filters: [], search: ""}

