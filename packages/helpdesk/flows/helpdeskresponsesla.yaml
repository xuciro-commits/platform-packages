name: build.helpdeskresponsesla
subject: {app: build, kind: object, name: helpdesk.ticket}
actions: [{app: build, kind: action, name: helpdesk.ticket.edit}]
definition:
  name: helpdeskresponsesla
  title: Watch first response SLA
  kind: flow
  object: helpdesk.ticket
  when: open
  steps:
    - {name: deadline, kind: wait, waitUntil: {source: subject, path: [responseby]}, next: pending}
    - {name: pending, kind: switch, value: {source: subject, path: [responsesla]}, cases: {due: missed}, next: done}
    - {name: missed, kind: action, act: edit, inputs: {responsesla: {source: literal, value: missed}}, next: tell}
    - name: tell
      kind: notify
      notify: {title: First response SLA missed, body: This ticket passed its first response deadline without a reply., field: owner}
      next: done
    - {name: done, kind: end}
