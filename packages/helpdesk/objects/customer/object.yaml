name: customer
namespace: helpdesk
title: Customer
plural: Customers
icon: building-office-2
display: title
naming: CUST-{year}-{n:5}
extends: party.organization
description: The support side of a business partner organization. The organization itself, with its name, contacts and addresses, is kept once in Business partners.
sets:
  tickets: {object: helpdesk.ticket, limit: 500}

fields:
  - {name: base, title: Organization, type: reference, ref: party.organization, required: true, search: true, group: Customer}
  - {name: title, title: Customer name, type: text, from: base.name, search: true, group: Customer}
  - {name: tier, title: Service tier, type: choice, default: standard, aside: true, choices: "standard:Standard,premium:Premium,enterprise:Enterprise"}
  - {name: owner, title: Account manager, type: member, default: member, aside: true}
  - {name: notes, title: Support notes, type: longtext, group: Customer}
  - {name: opentickets, title: Open tickets, type: integer, group: Summary, formula: "sum(tickets, if(item.state = 'open', 1, 0))"}
  - {name: totaltickets, title: Total tickets, type: integer, group: Summary, formula: "count(tickets)"}

access:
  - {role: agent, read: all, create: true, edit: true}
  - {role: supervisor, read: all, create: true, edit: true, archive: true}

view:
  version: 1
  layout: table
  columns: [title, tier, opentickets, totaltickets, owner]
  sort: [{sortKey: title, direction: ascending}]
  lanes: tier
  group: none
  filters: []
  search: ""
