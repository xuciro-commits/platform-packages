  - {name: confirmed, title: Confirmed, tone: success}
  - {name: cancelled, title: Dismissed, tone: neutral}
actions: [confirm, cancel]
access:
  - {role: reader, read: all}
  - {role: operator, read: all}
  - {role: planner, read: all, create: true, edit: true, archive: true}
  - {role: manager, read: all, create: true, edit: true, archive: true}
view: {version: 1, layout: table, columns: [material, unit, quantity, startdate, duedate, lowlevelcode, demandorigin, calculation, sourceid, generatedworkorder, state], sort: [{sortKey: startdate, direction: ascending}], group: state, lanes: "", filters: [], search: ""}
