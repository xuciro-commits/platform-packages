title: Material issue valuation reply
confirmationOnly: true
from: [inprogress, completed]
roles: [operator, planner, manager]
inputs:
  - {name: outcome, title: Outcome, type: text, required: true}
  - {name: reason, title: Refusal reason, type: text}
  - {name: ref, title: Movement reference, type: text}
  - {name: quantity, title: Movement quantity, type: decimal}
  - {name: amount, title: Movement valuation, type: decimal}
transaction:
  steps:
    - name: recordwip
      when: "input.outcome = 'accepted' and coalesce(input.ref, '') != ''"
      target: manufacturing.costentry
      set:
        title: "concat('WIP-', replace(coalesce(input.ref, ''), 'inventory.movement/', ''))"
        workorder: $subject
        postedon: "coalesce(issuedon, today())"
        quantity: "0 - coalesce(input.quantity, 0)"
        amount: "0 - coalesce(input.amount, 0)"
        movementtype: "'inventory.movement'"
        movementid: "replace(coalesce(input.ref, ''), 'inventory.movement/', '')"
    - name: recordrefusal
      when: "input.outcome != 'accepted'"
      target: $subject
      set:
        postingerror: "coalesce(input.reason, 'Material issue refused')"
