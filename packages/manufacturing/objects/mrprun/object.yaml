name: mrprun
namespace: manufacturing
title: MRP run
plural: MRP runs
icon: cpu-chip
display: title
naming: MRP-{year}-{n:5}
sets:
  plannedworkorders: {object: manufacturing.plannedworkorder, limit: 200}
  plannedrequisitions: {object: manufacturing.plannedrequisition, limit: 200}
fields:
  - {name: title, title: Planning run title, type: text, required: true, search: true}
  - {name: ranon, title: Last run date, type: date, default: today}
  - {name: workorderproposals, title: Draft planned work orders, type: integer, formula: "sum(plannedworkorders, if(item.state = 'draft', 1, 0))"}
  - {name: requisitionproposals, title: Draft planned requisitions, type: integer, formula: "sum(plannedrequisitions, if(item.state = 'draft', 1, 0))"}
  - {name: remarks, title: Planning notes, type: longtext}
states:
  - {name: draft, title: Draft, tone: neutral}
  - {name: completed, title: Completed, tone: success}
actions: [execute]
access:
  - {role: reader, read: all}
  - {role: operator, read: all}
  - {role: planner, read: all, create: true, edit: true}
  - {role: manager, read: all, create: true, edit: true}
view: {version: 1, layout: table, columns: [title, ranon, workorderproposals, requisitionproposals, state], sort: [{sortKey: ranon, direction: descending}], group: state, lanes: "", filters: [], search: ""}
