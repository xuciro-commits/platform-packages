name: stage
namespace: projects
title: Task stage
plural: Task stages
icon: queue-list
display: title

fields:
  - {name: title, title: Stage, type: text, required: true, search: true}
  - {name: position, title: Position, type: integer, required: true}
  - {name: color, title: Color, type: choice, choices: "gray:Gray,blue:Blue,green:Green,red:Red,orange:Orange,purple:Purple,pink:Pink,amber:Amber,cyan:Cyan"}

access:
  - {role: member, read: all}
  - {role: manager, read: all, create: true, edit: true, archive: true}

view: {version: 1, layout: table, columns: [title, position, color], sort: [{sortKey: position, direction: ascending}], group: none, lanes: "", filters: [], search: ""}

records:
  - {id: todo, title: To do, position: 1, color: gray}
  - {id: inprogress, title: In progress, position: 2, color: blue}
  - {id: review, title: In review, position: 3, color: amber}
