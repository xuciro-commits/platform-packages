Phone: 电话
Incoming and outgoing calls through the platform's voice gateway, answered and placed in the browser, with a call log matched to business partner contacts.: 经平台语音网关的来电与外呼，在浏览器里接听和拨打，通话记录自动对上往来单位的联系人。
It implements the call/1 capability, so other apps can place calls once an administrator binds it.: 它实现能力 call/1，管理员绑定后，别的应用也能从这里拨出电话。
Calls: 通话
Call: 通话
Missed calls: 未接来电
Calls in progress: 通话中
Talk time in seconds: 通话时长（秒）
Calls by direction: 按方向
Calls by outcome: 按结果
Talk time by agent: 各坐席通话时长
Calls by month: 每月通话
One incoming or outgoing call. The voice gateway records it and moves it through its states; agents add notes.: 一通来电或外呼。由语音网关记录并推进状态，坐席补充备注。
Direction: 方向
Incoming: 来电
Outgoing: 外呼
Number: 号码
Contact: 联系人
Organization: 往来单位
About: 关于
"The record this call is about, as type/ID.": 这通电话关于哪条记录，写作“类型/编号”。
Line: 线路
The trunk the call went through.: 这通电话经过的中继。
Started: 开始时间
Answered: 接通时间
Why it was missed: 未接原因
No answer: 无人接听
Hung up while ringing: 振铃时对方挂断
Declined: 拒接
Line busy: 线路忙
What went wrong: 失败原因
Notes: 备注
Agent: 坐席
Ringing: 振铃中
Ringing and not answered yet.: 正在振铃，还没有人接。
In progress: 通话中
"Answered; both sides are talking.": 已接通，双方正在通话。
Completed: 已完成
"Answered and ended, with its talk time.": 已接通并结束，记有通话时长。
Missed: 未接
Ended before anyone answered.: 没有人接就结束了。
Failed: 失败
The voice gateway could not carry the call.: 语音网关没能接通这通电话。
Connect: 接通
"The call was answered; the voice gateway records who took it and when, with its answer to the browser.": 电话被接起，语音网关记下谁接的、几点接的，并把应答交给浏览器。
Take: 接听
"Answer an incoming call or place an outgoing one in the browser; the first agent to take a ringing call gets it.": 在浏览器里接听来电或拨出电话；振铃中的来电由先接的坐席接到。
Hang up: 挂断
"End the call from the browser; the voice gateway hangs up the line and records how it ended.": 在浏览器里结束通话；语音网关挂断线路，并记下通话怎么结束的。
Media: 媒体
Browser session: 浏览器会话
"The browser's audio session description, written when someone takes or places the call.": 浏览器的音频会话描述，在有人接听或拨出时写入。
Gateway session: 网关会话
"The voice gateway's answer to the browser's session description.": 语音网关对浏览器会话描述的应答。
Hung up in the browser: 已在浏览器挂断
Someone else already took this call.: 这通电话已经有人接了。
This call is already hanging up.: 这通电话正在挂断。
Finish: 结束
"The answered call ended; the voice gateway records the talk time.": 接通的电话结束了，语音网关记下通话时长。
Mark missed: 记为未接
Mark failed: 记为失败
Add notes: 写备注
Write down what the call was about and what happens next.: 记下这通电话谈了什么、接下来做什么。
The call ended before anyone answered.: 这通电话没有人接就结束了。
Receive: 来电入线
An incoming call is ringing; the voice gateway records the line and the matched contact.: 来电正在振铃，语音网关记下线路和对上的联系人。
Leave empty until someone answers.: 有人接听前留空。
Rings first for: 优先振铃
"The contact's owner, who gets the call before everyone else.": 联系人负责人，来电先响给他。
Ringing for everyone: 已响给所有人
The contact's owner did not answer in time.: 联系人负责人没有及时接听。
"The contact's owner; only they can take the call until it rings for everyone.": 联系人负责人；在响给所有人之前，只有他能接。
Ring everyone: 响给所有人
"Nobody answered in time for the contact's owner, so the call now rings for every agent.": 联系人负责人没有及时接听，电话改为响给所有坐席。
Someone already took this call.: 这通电话已经有人接了。
"Someone else already took this call, or it is still ringing for the contact's owner.": 这通电话已经有人接了，或者还在优先响给联系人负责人。
Phone line: 线路
Phone lines: 线路
"A SIP trunk that registers with the voice gateway, such as a desk phone, a gateway device or a phone running a gateway app. The voice gateway reads these lines and picks up changes without a restart.": 注册到语音网关的 SIP 中继，例如话机、网关设备或装了网关应用的手机。语音网关读这里的线路，改动不用重启就生效。
Account: 账号
"The SIP user name the trunk registers with; letters, digits and - . _ only.": 中继注册用的 SIP 用户名，只用字母、数字和 - . _。
Password: 密码
The SIP password the trunk registers with.: 中继注册用的 SIP 密码。
In use: 启用
Turn off to stop the line registering without deleting it.: 关掉后这条线路不能注册，但不删除。
Number header: 号码头
"A header that repeats the dialed number, for trunks that do not read it from the Request-URI.": 重复被叫号码的消息头，给不从 Request-URI 读号码的中继用。
Fixed headers: 固定头
"One Name: value per line, sent with every outgoing call, such as the SIM slot to dial from.": "每行一个“名字: 值”，每通外呼都带上，例如用哪张 SIM 卡拨出。"
Another phone line already uses this account.: 已有线路使用这个账号。
Settings: 设置
Dialing: 拨号
